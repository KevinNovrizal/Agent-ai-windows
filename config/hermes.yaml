model:
  default: local-coding
  provider: custom
  base_url: http://127.0.0.1:11435/v1
  api_key: local-only
  context_length: 64000
  streaming: true
fallback_providers: []
agent:
  max_turns: 20
terminal:
  backend: docker
  cwd: .
  timeout: 60
  lifetime_seconds: 300
  docker_image: local-coding-sandbox:1
  docker_mount_cwd_to_workspace: true
  docker_run_as_host_user: true
  docker_extra_args:
  - --network=none
  - --pids-limit=128
  container_memory: 1024
  container_cpu: 2
  docker_persist_across_processes: false
platform_toolsets:
  cli:
  - terminal
  - file
  - memory
  - mcp-local
compression:
  enabled: true
  threshold: 0.5
memory:
  memory_enabled: true
  user_profile_enabled: false
web:
  backend: searxng
  keyless_fallback: false
auxiliary:
  vision:
    provider: main
    model: local-coding
    max_concurrency: 1
  web_extract:
    provider: main
    model: local-coding
    max_concurrency: 1
  compression:
    provider: main
    model: local-coding
    max_concurrency: 1
  title_generation:
    provider: main
    model: local-coding
    max_concurrency: 1
  curator:
    provider: main
    model: local-coding
    max_concurrency: 1
  background_review:
    provider: main
    model: local-coding
    max_concurrency: 1
    enabled: false
mcp_servers:
  local:
    command: /home/kevin/local-coding-agent/.venv/bin/python
    args:
    - /home/kevin/local-coding-agent/integration/mcp_server.py
    env:
      LOCAL_AGENT_WORKSPACE: ${LOCAL_AGENT_WORKSPACE}
    connect_timeout: 60
    timeout: 120
    sampling:
      enabled: false
tools:
  tool_search:
    enabled: 'off'

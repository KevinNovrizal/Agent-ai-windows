name: local-coding-agent
services:
  searxng:
    image: searxng/searxng@sha256:2fb0fa85096fe6df5c3ab98ecb4d6e0ee2ef66b8fb96ce6fce0f75b51c4bd90a
    ports:
    - 127.0.0.1:8888:8080
    volumes:
    - ./state/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    restart: unless-stopped
    mem_limit: 768m
  inference:
    image: ghcr.io/ggml-org/llama.cpp@sha256:3307a6cd90a76127de7dd960c020d5cf55c65c7b202b725f29895a67416c3021
    ports:
    - 127.0.0.1:11435:8080
    volumes:
    - ./state/models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - '0'
            capabilities:
            - gpu
    command:
    - -m
    - /models/Qwen3.5-4B-Q4_K_M.gguf
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - --alias
    - local-coding
    - -c
    - '64000'
    - -np
    - '1'
    - -ngl
    - '999'
    - -ot
    - .*=CUDA0
    - --fit
    - 'off'
    - --load-mode
    - none
    - --lazy-mode
    - 'off'
    - -fa
    - 'on'
    - -ctk
    - q8_0
    - -ctv
    - q8_0
    - --jinja
    - -n
    - '2048'
    - --reasoning
    - 'off'
    - -lv
    - '4'
    - --cache-ram
    - '0'
    restart: unless-stopped
volumes:
  ollama-models:
    external: true
    name: ai-stack_ollama
